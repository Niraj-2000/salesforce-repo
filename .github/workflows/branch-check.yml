name: Lint PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: write
  contents: read
  statuses: write

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------
      # 1️⃣ Validate Conventional Commit Format
      # ------------------------------------------------
      - name: Validate Semantic PR
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          validateSingleCommit: false
          validateSingleCommitMatchesPrTitle: false
          wip: true

      # ------------------------------------------------
      # 2️⃣ Validate Copado + Azure Ticket Numbers
      # ------------------------------------------------
      - name: Validate Copado and Azure Ticket Numbers
        run: |
          echo "Validating ticket numbers in PR title..."
          title="${{ github.event.pull_request.title }}"
          echo "PR Title: $title"
          # Copado ticket (MUST be uppercase + 7 digits)
          copado_regex="US-[0-9]{7}"
          # Azure ticket
          azure_regex="AB#[0-9]+"
          if [[ "$title" =~ $copado_regex && "$title" =~ $azure_regex ]]; then
            echo "✅ Copado ticket detected"
            echo "✅ Azure ticket detected"
          else
            echo "❌ ERROR:"
            echo "PR title must contain:"
            echo " - Copado ticket in UPPERCASE like US-0000015"
            echo " - Azure ticket likes AB#1234"
            echo ""
            echo "Correct example:"
            echo "feat: add payment validation US-0000015 AB#1234"
            exit 1
          fi
